services:
  mcp:
    image: mcp:latest
    container_name: mcp
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MCP_PORT:-3999}:3999"
    environment:
      - DARAJA_MCP_MODE=http
      - MCP_PORT=3999
      # NFR-SEC-005 / gate G1: no all-interfaces bind address may appear in
      # this file, and check-gate-g1.sh greps for the literal — so it is not
      # written here even in a comment. The bind address is an operator
      # decision, taken in the shell:
      #   default           -> loopback inside the container (nothing exposed)
      #   MCP_HOST=<addr>   -> explicit opt-in, and MCP_AUTH_TOKEN is then
      #                        required as well (NFR-SEC-004)
      - MCP_HOST=${MCP_HOST:-127.0.0.1}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
      - MPESA_ENVIRONMENT=${MPESA_ENVIRONMENT:-sandbox}
      - MPESA_PASSKEY=${MPESA_PASSKEY:-}
      - MPESA_INITIATOR_NAME=${MPESA_INITIATOR_NAME:-}
      - MPESA_INITIATOR_PASSWORD=${MPESA_INITIATOR_PASSWORD:-}
      - MPESA_SECURITY_CREDENTIAL=${MPESA_SECURITY_CREDENTIAL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3999/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

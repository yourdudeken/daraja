services:
  mcp:
    image: mcp:latest
    container_name: mcp
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MCP_PORT:-3999}:3999"
    environment:
      - DARAJA_MCP_MODE=http
      - MCP_PORT=3999
      - MCP_HOST=0.0.0.0
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
      - MPESA_ENVIRONMENT=${MPESA_ENVIRONMENT:-sandbox}
      - MPESA_PASSKEY=${MPESA_PASSKEY:-}
      - MPESA_INITIATOR_NAME=${MPESA_INITIATOR_NAME:-}
      - MPESA_INITIATOR_PASSWORD=${MPESA_INITIATOR_PASSWORD:-}
      - MPESA_SECURITY_CREDENTIAL=${MPESA_SECURITY_CREDENTIAL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3999/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

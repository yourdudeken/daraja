services:
  mcp:
    image: mcp:latest
    container_name: mcp
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Bind to loopback on the host by default: safe for local use, and a
      # reverse proxy running on the same host can still reach it. Change to
      # "${MCP_PORT:-3999}:3999" (all interfaces) to expose MCP_AUTH-required
      # endpoints directly to the network.
      - "127.0.0.1:${MCP_PORT:-3999}:3999"
    environment:
      - DARAJA_MCP_MODE=http
      - MCP_PORT=3999
      - MCP_HOST=0.0.0.0
      - MCP_AUTH_REQUIRED=${MCP_AUTH_REQUIRED:-true}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - MCP_AUTH_TOKENS=${MCP_AUTH_TOKENS:-}
      - MCP_READONLY_MODE=${MCP_READONLY_MODE:-false}
      - MCP_ALLOWED_TOOLS=${MCP_ALLOWED_TOOLS:-}
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
      - MPESA_ENVIRONMENT=${MPESA_ENVIRONMENT:-sandbox}
      - MPESA_PASSKEY=${MPESA_PASSKEY:-}
      - MPESA_INITIATOR_NAME=${MPESA_INITIATOR_NAME:-}
      - MPESA_INITIATOR_PASSWORD=${MPESA_INITIATOR_PASSWORD:-}
      - MPESA_SECURITY_CREDENTIAL=${MPESA_SECURITY_CREDENTIAL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3999/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

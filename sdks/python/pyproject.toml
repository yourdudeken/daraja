[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daraja-sdk-py"
version = "0.0.4"
description = "Production-grade Python SDK for Safaricom M-Pesa Daraja API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mpesa", "safaricom", "daraja", "payment", "mobile-money"]
authors = [
  { name = "M-Pesa SDK Team" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business :: Financial",
]

dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "opentelemetry-api>=1.16.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0"]
django = ["django>=4.2.0"]
flask = ["flask>=2.3.0"]
redis = ["redis>=5.0.0"]
all = [
  "fastapi>=0.100.0",
  "django>=4.2.0",
  "flask>=2.3.0",
  "redis>=5.0.0",
  "prometheus-client>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/yourdudeken/mpesa-sdk"
Repository = "https://github.com/yourdudeken/mpesa-sdk"

[project.scripts]
daraja = "daraja.cli:main"

[tool.hatch.envs.default]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "cryptography>=42.0.0",
  "pytest>=8.0.0",
  "respx>=0.22.0",
  "hypothesis>=6.0.0",
  "prometheus-client>=0.19.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
generate = "datamodel-codegen --input ../../openapi/mpesa.yaml --output daraja/generated/models.py --target-python-version 3.11 --field-constraints"

[tool.hatch.envs.codegen]
dependencies = [
  "datamodel-code-generator>=0.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/daraja"]

# NFR-SEC-017 / WBS-018 (AC-049).
#
# A real `.env` was being packed into the sdist. Hatchling's VCS-based
# exclusion reads the .gitignore *nearest the project root* — and
# sdks/python/ has no .gitignore of its own, so the repository-root rules
# (which do exclude `.env`) were never consulted. The result shipped live
# MPESA_CONSUMER_KEY / CONSUMER_SECRET / PASSKEY / INITIATOR_PASSWORD to PyPI.
#
# These patterns are declared EXPLICITLY, on purpose. AC-049 requires the
# exclusion to hold without `git check-ignore` behaving correctly: a VCS-ignore
# dependency is exactly what failed here, and it would fail again for anyone who
# builds from an exported tarball, a CI cache, or a shallow clone.
[tool.hatch.build]
exclude = [
  # Never pack credentials. Matched at any depth, and with or without a suffix.
  "/.env",
  "/.env.*",
  "**/.env",
  "**/.env.*",
  # Local test/typing artefacts picked up by a stray run.
  "/.coverage",
  "**/.coverage",
  "/.hypothesis",
  "**/.hypothesis",
  "/.pytest_cache",
  "**/.pytest_cache",
  "/.mypy_cache",
  "**/.mypy_cache",
  "/.ruff_cache",
  "**/.ruff_cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
omit = ["src/daraja/generated/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Model fields intentionally use PascalCase to match the Daraja API wire format.
"src/daraja/models/__init__.py" = ["N815"]
"src/daraja/generated/models.py" = ["N815"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

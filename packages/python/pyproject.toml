[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daraja-sdk-py"
version = "0.0.1"
description = "Production-grade Python SDK for Safaricom M-Pesa Daraja API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mpesa", "safaricom", "daraja", "payment", "mobile-money"]
authors = [
  { name = "M-Pesa SDK Team" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business :: Financial",
]

dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "opentelemetry-api>=1.16.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0"]
django = ["django>=4.2.0"]
flask = ["flask>=2.3.0"]
redis = ["redis>=5.0.0"]
all = [
  "fastapi>=0.100.0",
  "django>=4.2.0",
  "flask>=2.3.0",
  "redis>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/yourdudeken/mpesa-sdk"
Repository = "https://github.com/yourdudeken/mpesa-sdk"

[project.scripts]
daraja = "daraja.cli:main"

[tool.hatch.envs.default]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "cryptography>=42.0.0",
  "pytest>=8.0.0",
  "respx>=0.22.0",
  "hypothesis>=6.0.0",
  "prometheus-client>=0.19.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
generate = "datamodel-codegen --input ../../openapi/mpesa.yaml --output daraja/generated/models.py --target-python-version 3.11 --field-constraints"

[tool.hatch.envs.codegen]
dependencies = [
  "datamodel-code-generator>=0.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/daraja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Model fields intentionally use PascalCase to match the Daraja API wire format.
"src/daraja/models/__init__.py" = ["N815"]
"src/daraja/generated/models.py" = ["N815"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

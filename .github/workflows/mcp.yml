name: MCP Server

on:
  push:
    branches: [main]
    paths: ["mcp/**", "scripts/**"]
  pull_request:
    paths: ["mcp/**", "scripts/**"]

jobs:
  test:
    name: MCP tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test

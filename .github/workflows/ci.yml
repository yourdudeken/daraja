name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[all]" pytest hypothesis respx ruff mypy pytest-cov
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy src/daraja
      - name: Test (coverage threshold enforced via pyproject.toml)
        # WBS-002 / NFR-SC-002: collect the whole test tree, not just tests/unit.
        # tests/integration/ is excluded at DIRECTORY level, not by skipping
        # individual tests: it requires live MPESA sandbox credentials
        # (tests/integration/test_suite.py reads MPESA_CONSUMER_KEY at import).
        run: pytest tests --ignore=tests/integration --cov=daraja -v
      - name: Build
        run: pip install build && python -m build
      # NFR-SEC-017 / WBS-018 (AC-049). Required, and it inspects the BUILT
      # sdist's file list — not .gitignore, and not the declared exclusions.
      # A .env carries live M-Pesa credentials and an sdist goes to PyPI, so
      # this fails the build rather than warning. Do NOT make this advisory.
      - name: No .env in the sdist (NFR-SEC-017, AC-049)
        run: bash scripts/check-sdist-no-secrets.sh

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  mcp:
    name: MCP Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      # Mechanical enforcement of the hard release gate. Required, and it fails
      # closed: the SEC-MCP-004 body-parser fix may not land before, or without,
      # transport auth and the removal of the 0.0.0.0 default bind.
      # Do NOT make this advisory (plans/01-milestones.md §M1, G1).
      - name: Release gate G1 (NFR-SEC-004 + NFR-SEC-005, TRD-08)
        run: bash scripts/check-gate-g1.sh
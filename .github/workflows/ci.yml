name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[all]" pytest hypothesis respx ruff mypy pytest-cov
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy src/daraja
      - name: Test (coverage threshold enforced via pyproject.toml)
        run: pytest tests/unit --cov=daraja -v
      - name: Build
        run: pip install build && python -m build

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: Coverage (>=80%, excluding generated and integration harness)
        run: |
          go test -coverprofile=coverage.out ./...
          awk 'BEGIN{t=0;c=0} !/^mode:/ && $0 !~ /\/generated\// && $0 !~ /\/tests\/integration\// {t+=$2; if($3>0)c+=$2} END{p=100*c/t; printf "coverage: %.1f%% of statements\n", p; if (p < 80) exit 1}' coverage.out

  mcp:
    name: MCP Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Build TypeScript SDK dependency
        run: npm --prefix ../sdks/typescript install && npm --prefix ../sdks/typescript run build
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
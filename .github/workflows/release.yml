name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      python--release_created: ${{ steps.release.outputs['sdks/python--release_created'] }}
      python--tag_name: ${{ steps.release.outputs['sdks/python--tag_name'] }}
      python--version: ${{ steps.release.outputs['sdks/python--version'] }}
      typescript--release_created: ${{ steps.release.outputs['sdks/typescript--release_created'] }}
      typescript--tag_name: ${{ steps.release.outputs['sdks/typescript--tag_name'] }}
      typescript--version: ${{ steps.release.outputs['sdks/typescript--version'] }}
      go--release_created: ${{ steps.release.outputs['sdks/go--release_created'] }}
      go--tag_name: ${{ steps.release.outputs['sdks/go--tag_name'] }}
      go--version: ${{ steps.release.outputs['sdks/go--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Use a PAT (RELEASE_PLEASE_TOKEN) so release PRs trigger CI;
          # falls back to GITHUB_TOKEN until one is configured.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-python:
    name: Publish Python SDK to PyPI
    needs: release-please
    if: ${{ needs.release-please.outputs.python--release_created == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.python--tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: pip install -e ".[all]" pytest hypothesis respx && pytest tests/unit -v
      - name: Build
        run: pip install build && python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-typescript:
    name: Publish TypeScript SDK to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.typescript--release_created == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.typescript--tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-go:
    name: Release Go SDK binaries
    needs: release-please
    if: ${{ needs.release-please.outputs.go--release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.go--tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sdks/go/go.sum
      - name: Build CLI binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean --skip=validate
          workdir: sdks/go
        env:
          GORELEASER_CURRENT_TAG: v${{ needs.release-please.outputs.go--version }}
      - name: Upload binaries to GitHub Release
        working-directory: sdks/go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.go--tag_name }}" dist/* --clobber
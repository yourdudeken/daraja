name: Release

# Releases each SDK independently when a PR is merged to main.
#
# Each component owns its own version and release tag:
#   TypeScript SDK -> typescript-vX.Y.Z  (npm)
#   Python SDK     -> python-vX.Y.Z      (PyPI)
#   MCP Server     -> mcp-vX.Y.Z        (Docker Hub)
#
# The MCP release builds a Docker image that depends on the *published*
# daraja-sdk-ts package. mcp/package.json pins an exact SDK version (and
# package-lock.json locks it), so the image is built from the committed
# lockfile with npm ci — no SDK publish ordering is involved. SDK updates
# are adopted by the MCP deliberately, by bumping the pinned version.
#
# On push to main, the detect job compares each component's manifest version
# against its latest tag and releases only the components whose version
# changed. workflow_dispatch allows forcing a release with explicit versions.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      typescript_version:
        description: "TypeScript SDK version (e.g. 0.0.2). Leave empty to use package.json."
        required: false
        type: string
      python_version:
        description: "Python SDK version (e.g. 0.0.2). Leave empty to use pyproject.toml."
        required: false
        type: string
      mcp_version:
        description: "MCP Server version (e.g. 0.0.1). Leave empty to use mcp/package.json."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect SDK versions
    runs-on: ubuntu-latest
    outputs:
      typescript_version: ${{ steps.ts.outputs.version }}
      typescript_release: ${{ steps.ts.outputs.release }}
      python_version: ${{ steps.py.outputs.version }}
      python_release: ${{ steps.py.outputs.release }}
      mcp_version: ${{ steps.mcp.outputs.version }}
      mcp_release: ${{ steps.mcp.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect TypeScript SDK
        id: ts
        run: |
          if [ -n "${{ github.event.inputs.typescript_version }}" ]; then
            echo "version=${{ github.event.inputs.typescript_version }}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./sdks/typescript/package.json').version")
            LATEST=$(git tag -l 'typescript-v*' --sort=-v:refname | head -1 | sed 's/typescript-v//')
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            if [ -z "$LATEST" ] || [ "$VERSION" != "$LATEST" ]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Detect Python SDK
        id: py
        run: |
          if [ -n "${{ github.event.inputs.python_version }}" ]; then
            echo "version=${{ github.event.inputs.python_version }}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -m1 '^version' sdks/python/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
            LATEST=$(git tag -l 'python-v*' --sort=-v:refname | head -1 | sed 's/python-v//')
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            if [ -z "$LATEST" ] || [ "$VERSION" != "$LATEST" ]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Detect MCP Server
        id: mcp
        run: |
          if [ -n "${{ github.event.inputs.mcp_version }}" ]; then
            echo "version=${{ github.event.inputs.mcp_version }}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./mcp/package.json').version")
            LATEST=$(git tag -l 'mcp-v*' --sort=-v:refname | head -1 | sed 's/mcp-v//')
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            if [ -z "$LATEST" ] || [ "$VERSION" != "$LATEST" ]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  publish-typescript:
    name: Publish TypeScript SDK
    needs: detect
    if: needs.detect.outputs.typescript_release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Set package version
        run: npm pkg set version="${{ needs.detect.outputs.typescript_version }}"
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: typescript-v${{ needs.detect.outputs.typescript_version }}
          name: TypeScript SDK v${{ needs.detect.outputs.typescript_version }}
          generate_release_notes: true

  publish-python:
    name: Publish Python SDK
    needs: detect
    if: needs.detect.outputs.python_release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set distribution version
        run: |
          python - "${{ needs.detect.outputs.python_version }}" <<'EOF'
          import re, sys, pathlib
          v = sys.argv[1]
          p = pathlib.Path("pyproject.toml")
          t = p.read_text()
          t = re.sub(r'version\s*=\s*"[^"]+"', f'version = "{v}"', t, count=1)
          p.write_text(t)
          EOF
      - name: Test
        run: pip install -e ".[all]" pytest hypothesis respx && pytest tests/unit -v
      - name: Build
        run: pip install build && python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Build step runs in sdks/python (working-directory), so dist/ is
          # relative to the workspace root, not the job's working directory.
          packages-dir: sdks/python/dist
          # Token auth (set PYPI_API_TOKEN secret). For trusted publishing
          # instead, remove these two lines and configure the publisher on
          # PyPI with workflow name "release.yml" and no environment.
          username: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: python-v${{ needs.detect.outputs.python_version }}
          name: Python SDK v${{ needs.detect.outputs.python_version }}
          generate_release_notes: true

  publish-docker:
    name: Publish MCP Docker image
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.mcp_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Builds from the committed package.json + package-lock.json, which pin
      # the published daraja-sdk-ts version (npm ci).
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: mcp/
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/daraja-mcp:${{ needs.detect.outputs.mcp_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/daraja-mcp:latest

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mcp-v${{ needs.detect.outputs.mcp_version }}
          name: MCP Server v${{ needs.detect.outputs.mcp_version }}
          generate_release_notes: true

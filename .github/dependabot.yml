version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/packages/typescript"
    schedule:
      interval: "weekly"
    groups:
      ts-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    groups:
      mcp-deps:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/packages/python"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/packages/go"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-deps:
        patterns: ["*"]